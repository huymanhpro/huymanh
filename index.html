<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Matrix Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        /* Hiệu ứng ma trận nền */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.15;
        }
        .container {
            position: relative;
            z-index: 2;
            border: 2px solid #00ff00;
            background: rgba(0, 10, 0, 0.85);
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 0 20px #00ff00;
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        h1 {
            font-size: 2.5rem;
            letter-spacing: 5px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #00ff00;
            animation: blink 1.5s infinite;
        }
        .select-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 25px;
        }
        select {
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px;
            font-size: 1.1rem;
            font-family: inherit;
            width: 30%;
            cursor: pointer;
            outline: none;
            border-radius: 3px;
        }
        select:focus {
            box-shadow: 0 0 10px #00ff00;
        }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            border-radius: 3px;
            width: 100%;
        }
        button:hover {
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            box-shadow: 0 0 15px #00ff00;
        }
        #result {
            margin-top: 25px;
            font-size: 1.5rem;
            min-height: 40px;
            font-weight: bold;
        }
        .final-char {
            font-size: 4rem;
            display: block;
            margin-top: 10px;
            text-shadow: 0 0 20px #00ff00;
            animation: pulse 1s infinite alternate;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <canvas id="matrix-bg"></canvas>

    <div class="container">
        <h1>HUY MẠNH</h1>
        
        <div class="select-group">
            <select id="num1">
                <option value="none">Trống</option>
                <!-- Thêm từ 1 đến 9 -->
                <script>
                    for(let i=1; i<=9; i++) document.write(`<option value="${i}">${i}</option>`);
                </script>
            </select>
            <select id="num2">
                <option value="none">Trống</option>
                <script>
                    for(let i=1; i<=9; i++) document.write(`<option value="${i}">${i}</option>`);
                </script>
            </select>
            <select id="num3">
                <option value="none">Trống</option>
                <script>
                    for(let i=1; i<=9; i++) document.write(`<option value="${i}">${i}</option>`);
                </script>
            </select>
        </div>

        <button onclick="executeHack()">OK</button>

        <div id="result"></div>
    </div>

    <script>
        // Hiệu ứng chữ rơi Matrix cho đúng chất hacker
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const alphabet = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const rainDrops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 30);

        // Logic tính toán chính theo yêu cầu
        function executeHack() {
            const val1 = document.getElementById('num1').value;
            const val2 = document.getElementById('num2').value;
            const val3 = document.getElementById('num3').value;

            // Tập hợp các số bị loại bỏ (chuyển về số nếu không phải "none")
            const excluded = [];
            if(val1 !== 'none') excluded.push(parseInt(val1));
            if(val2 !== 'none') excluded.push(parseInt(val2));
            if(val3 !== 'none') excluded.push(parseInt(val3));

            // 1. Tính tổng các số từ 1 tới 9 sau khi loại bỏ các số đã chọn
            let sum = 0;
            for(let i = 1; i <= 9; i++) {
                if(!excluded.includes(i)) {
                    sum += i;
                }
            }

            // 2. Tách số tổng thành các chữ số (ví dụ ab) rồi tính a + b
            let sumStr = sum.toString();
            let nextSum = 0;
            for(let i = 0; i < sumStr.length; i++) {
                nextSum += parseInt(sumStr[i]);
            }

            // 3. Nếu tổng các chữ số lớn hơn 9 thì trừ đi 9
            if(nextSum > 9) {
                nextSum -= 9;
            }

            // 4. Kiểm tra chẵn lẻ để hiển thị kết quả P hoặc B
            let finalChar = '';
            if(nextSum % 2 === 0) {
                finalChar = 'P'; // Chẵn
            } else {
                finalChar = 'B'; // Lẻ
            }

            // Hiển thị ra màn hình với hiệu ứng đổi màu
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `Tổng còn lại: ${sum} <br> Kết quả: <span class="final-char">${finalChar}</span>`;
        }
    </script>
</body>
</html>
