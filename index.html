<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bộ Lọc Dãy Số Thông Minh</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        textarea, input[type="text"], select {
            width: 100%;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        textarea:focus, input[type="text"]:focus, select:focus {
            border-color: #3498db;
            outline: none;
        }
        textarea {
            height: 140px;
            resize: vertical;
            font-family: monospace;
            background-color: #fafafa;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            white-space: nowrap;
        }
        button:hover {
            background-color: #2980b9;
        }
        .filter-section {
            background: #eef2f7;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid #e2e8f0;
        }
        .quick-result {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            background: #fff;
            padding: 12px;
            border-radius: 6px;
            border: 2px dashed #3498db;
            text-align: center;
        }
        .result-container {
            margin-top: 25px;
        }
        .result-item {
            background: #f8f9fa;
            border-left: 5px solid #2ecc71;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .result-item.no-match {
            border-left-color: #e74c3c;
        }
        .badge {
            background: #2ecc71;
            color: white;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge.zero {
            background: #95a5a6;
        }
        .hint {
            font-size: 13px;
            color: #7f8c8d;
            margin-top: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Bộ Lọc Số Thông Minh</h2>
    
    <label for="dataInput">Danh sách dãy số gốc (Đã xếp từ nhỏ đến lớn):</label>
    <textarea id="dataInput">0=012579
1=123458
2=125689
3=135689
4=145789
5=023578
6=013679
7=124789
8=134589
9=012459</textarea>
    
    <!-- TÍNH NĂNG 1: Chọn từ 0 đến 9 ở bên phải -->
    <div class="filter-section">
        <label for="digitSelect">Xem nhanh vế phải dấu bằng (=):</label>
        <select id="digitSelect" onchange="getRightSideValue()">
            <option value="">-- Chọn một số từ 0 đến 9 --</option>
            <option value="0">Số 0</option>
            <option value="1">Số 1</option>
            <option value="2">Số 2</option>
            <option value="3">Số 3</option>
            <option value="4">Số 4</option>
            <option value="5">Số 5</option>
            <option value="6">Số 6</option>
            <option value="7">Số 7</option>
            <option value="8">Số 8</option>
            <option value="9">Số 9</option>
        </select>
        <div id="quickResult" class="quick-result" style="display: none;"></div>
    </div>

    <!-- TÍNH NĂNG 2: Tìm kiếm tối đa 3 số trùng khớp -->
    <label for="searchInput">Tìm kiếm trùng khớp (Tối đa 3 số):</label>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Ví dụ: 2 4 6 hoặc 246" maxlength="10">
        <button onclick="searchNumbers()">Tìm kiếm</button>
    </div>
    <div class="hint">Nhập các số viết liền hoặc cách nhau. Hệ thống tự xếp trùng nhiều nhất lên đầu.</div>

    <div class="result-container">
        <label>Kết quả lọc trùng khớp:</label>
        <div id="resultList">
            <div style="color: #7f8c8d; text-align: center; margin-top: 20px;">Nhập số vào ô tìm kiếm và bấm nút để xem kết quả.</div>
        </div>
    </div>
</div>

<script>
// Hàm lấy dãy số bên phải khi chọn từ 0-9
function getRightSideValue() {
    const dataInput = document.getElementById('dataInput').value.trim();
    const selectedDigit = document.getElementById('digitSelect').value;
    const quickResult = document.getElementById('quickResult');

    if (!selectedDigit) {
        quickResult.style.display = 'none';
        return;
    }

    if (!dataInput) {
        quickResult.style.display = 'block';
        quickResult.innerHTML = '<span style="color: #e74c3c;">Vui lòng dán danh sách số vào ô dữ liệu!</span>';
        return;
    }

    const lines = dataInput.split('\n');
    let foundValue = null;

    for (let line of lines) {
        if (line.includes('=')) {
            const parts = line.split('=');
            const prefix = parts[0].trim();
            const rightSide = parts[1].trim();

            if (prefix === selectedDigit) {
                foundValue = rightSide;
                break;
            }
        }
    }

    quickResult.style.display = 'block';
    if (foundValue) {
        quickResult.innerHTML = `Kết quả của số ${selectedDigit} là: <span style="color: #2ecc71; font-size: 22px; letter-spacing: 2px;">${foundValue}</span>`;
    } else {
        quickResult.innerHTML = `<span style="color: #e74c3c;">Không tìm thấy dòng bắt đầu bằng "${selectedDigit}="</span>`;
    }
}

// Hàm tìm kiếm và sắp xếp theo số lượng số trùng khớp
function searchNumbers() {
    const dataInput = document.getElementById('dataInput').value.trim();
    const searchInput = document.getElementById('searchInput').value.trim();
    const resultList = document.getElementById('resultList');
    
    if (!dataInput) {
        resultList.innerHTML = '<div style="color: #e74c3c; text-align: center; margin-top: 20px;">Vui lòng nhập danh sách dãy số!</div>';
        return;
    }

    // Lấy tối đa 3 chữ số cần tìm kiếm
    let searchDigits = searchInput.replace(/\s+/g, '').split('');
    if (searchDigits.length > 3) {
        searchDigits = searchDigits.slice(0, 3);
    }

    const lines = dataInput.split('\n');
    const results = [];

    lines.forEach(line => {
        if (line.includes('=')) {
            const parts = line.split('=');
            const rightSide = parts[1].trim();
            
            let matchCount = 0;
            let tempRightSide = rightSide; 

            searchDigits.forEach(digit => {
                if (tempRightSide.includes(digit)) {
                    matchCount++;
                    tempRightSide = tempRightSide.replace(digit, ''); // loại bỏ ký tự đã đếm
                }
            });

            results.push({
                originalLine: line.trim(),
                matchCount: matchCount
            });
        }
    });

    // Sắp xếp: Trùng nhiều số nhất nhảy lên đầu
    results.sort((a, b) => b.matchCount - a.matchCount);

    if (results.length === 0) {
        resultList.innerHTML = '<div style="color: #e74c3c; text-align: center; margin-top: 20px;">Dữ liệu không đúng định dạng.</div>';
        return;
    }

    let htmlOutput = '';
    results.forEach(item => {
        const isZero = item.matchCount === 0;
        htmlOutput += `
            <div class="result-item ${isZero ? 'no-match' : ''}">
                <span style="font-size: 17px; font-weight: 500; letter-spacing: 1px;">${item.originalLine}</span>
                <span class="badge ${isZero ? 'zero' : ''}">Trùng: ${item.matchCount} số</span>
            </div>
        `;
    });

    resultList.innerHTML = htmlOutput;
}
</script>

</body>
</html>
