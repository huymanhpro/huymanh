<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quy Đổi Bài Sang Xúc Xắc</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.2rem;
        }
        .container {
            display: flex;
            width: 100%;
            max-width: 600px;
            gap: 15px;
        }
        .side {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .side-left {
            background-color: #1b4d3e; /* Màu xanh */
            border: 2px solid #2ecc71;
        }
        .side-right {
            background-color: #4a1515; /* Màu đỏ */
            border: 2px solid #e74c3c;
        }
        .side-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        .slot {
            margin-bottom: 12px;
        }
        .slot label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            opacity: 0.9;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: #fff;
            color: #000;
            font-weight: bold;
            font-size: 1rem;
        }
        .result-box {
            margin-top: 20px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 5px;
            text-align: center;
        }
        .total-score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f1c40f;
            margin-top: 5px;
        }
        .status-3rd {
            font-size: 0.85rem;
            color: #bdc3c7;
            margin-top: 5px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h2>ỨNG DỤNG QUY ĐỔI BÀI SANG XÚC XẮC</h2>

    <div class="container">
        <!-- BÊN TRÁI (XANH) -->
        <div class="side side-left">
            <div class="side-title">BÊN XANH</div>
            
            <div class="slot">
                <label>Ô 1:</label>
                <select class="card-input left-input" onchange="calculate()">
                    <option value="">-- Chọn bài --</option>
                    <option value="A">Át (A)</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="J">J</option>
                    <option value="Q">Q</option>
                    <option value="K">K</option>
                </select>
            </div>

            <div class="slot">
                <label>Ô 2:</label>
                <select class="card-input left-input" onchange="calculate()">
                    <option value="">-- Chọn bài --</option>
                    <option value="A">Át (A)</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="J">J</option>
                    <option value="Q">Q</option>
                    <option value="K">K</option>
                </select>
            </div>

            <div class="slot">
                <label>Ô 3 (Tùy chọn):</label>
                <select id="left-3" class="card-input left-input" onchange="calculate()">
                    <option value="">-- Không có --</option>
                    <option value="A">Át (A)</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="J">J</option>
                    <option value="Q">Q</option>
                    <option value="K">K</option>
                </select>
            </div>

            <div class="result-box">
                <div>Tổng điểm xúc sắc:</div>
                <div id="total-left" class="total-score">0</div>
                <div id="status-left-3" class="status-3rd">Ô 3: Không</div>
            </div>
        </div>

        <!-- BÊN PHẢI (ĐỎ) -->
        <div class="side side-right">
            <div class="side-title">BÊN ĐỎ</div>
            
            <div class="slot">
                <label>Ô 1:</label>
                <select class="card-input right-input" onchange="calculate()">
                    <option value="">-- Chọn bài --</option>
                    <option value="A">Át (A)</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="J">J</option>
                    <option value="Q">Q</option>
                    <option value="K">K</option>
                </select>
            </div>

            <div class="slot">
                <label>Ô 2:</label>
                <select class="card-input right-input" onchange="calculate()">
                    <option value="">-- Chọn bài --</option>
                    <option value="A">Át (A)</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="J">J</option>
                    <option value="Q">Q</option>
                    <option value="K">K</option>
                </select>
            </div>

            <div class="slot">
                <label>Ô 3 (Tùy chọn):</label>
                <select id="right-3" class="card-input right-input" onchange="calculate()">
                    <option value="">-- Không có --</option>
                    <option value="A">Át (A)</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="J">J</option>
                    <option value="Q">Q</option>
                    <option value="K">K</option>
                </select>
            </div>

            <div class="result-box">
                <div>Tổng điểm xúc sắc:</div>
                <div id="total-right" class="total-score">0</div>
                <div id="status-right-3" class="status-3rd">Ô 3: Không</div>
            </div>
        </div>
    </div>

    <script>
        // Hàm quy đổi giá trị lá bài sang điểm xúc xắc theo ảnh
        function getDicePoint(card) {
            if (!card) return 0;
            if (['A', '10', 'J', 'Q', 'K'].includes(card)) return 1;
            if (['2', '3'].includes(card)) return 2;
            if (['4', '5'].includes(card)) return 3;
            if (['6', '7'].includes(card)) return 4;
            if (card === '8') return 5;
            if (card === '9') return 6;
            return 0;
        }

        function calculate() {
            // Tính toán Bên Xanh (Trái)
            let leftInputs = document.querySelectorAll('.left-input');
            let totalLeft = 0;
            leftInputs.forEach(input => {
                totalLeft += getDicePoint(input.value);
            });
            document.getElementById('total-left').innerText = totalLeft;

            // Kiểm tra ô thứ 3 Bên Xanh
            let left3 = document.getElementById('left-3').value;
            document.getElementById('status-left-3').innerText = left3 ? `Ô 3: Có bài (${getDicePoint(left3)}đ)` : "Ô 3: Không";

            // Tính toán Bên Đỏ (Phải)
            let rightInputs = document.querySelectorAll('.right-input');
            let totalRight = 0;
            rightInputs.forEach(input => {
                totalRight += getDicePoint(input.value);
            });
