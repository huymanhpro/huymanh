<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Kết Quả CL</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }
        h2 {
            color: #333;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }
        .input-box {
            width: 70px;
            height: 50px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            background-color: #fff;
            transition: all 0.2s;
        }
        .input-box:focus {
            outline: none;
            border-color: #007bff;
        }
        .result-container {
            margin-top: 20px;
        }
        .result-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        #result-box {
            width: 100%;
            height: 100px;
            font-size: 48px;
            font-weight: bold;
            color: #fff;
            background-color: #343a40;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }
        #custom-input-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed #ccc;
            display: none;
        }
        .custom-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }
        #custom-result-input {
            width: 120px;
            height: 40px;
            font-size: 18px;
            text-align: center;
            border: 2px solid #28a745;
            border-radius: 5px;
            text-transform: uppercase;
        }
        #save-btn {
            height: 44px;
            padding: 0 20px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #save-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Hệ Thống Tra Cứu Kết Quả</h2>
    
    <!-- 4 ô nhập, click vào sẽ tự đổi giữa C và L -->
    <div class="input-group">
        <input type="text" class="input-box" id="box1" value="C" readonly onclick="toggleValue(this)">
        <input type="text" class="input-box" id="box2" value="C" readonly onclick="toggleValue(this)">
        <input type="text" class="input-box" id="box3" value="C" readonly onclick="toggleValue(this)">
        <input type="text" class="input-box" id="box4" value="C" readonly onclick="toggleValue(this)">
    </div>

    <!-- Ô hiện kết quả to -->
    <div class="result-container">
        <div class="result-label">KẾT QUẢ TRA CỨU</div>
        <div id="result-box">?</div>
    </div>

    <!-- Ô nhập thêm dữ liệu mới nếu chưa có trong danh sách -->
    <div id="custom-input-section">
        <div class="result-label" style="color: #dc3545; font-weight: bold;">Không tìm thấy dữ liệu! Nhập kết quả mới:</div>
        <div class="custom-group">
            <input type="text" id="custom-result-input" placeholder="P, B hoặc H" maxlength="1">
            <button id="save-btn" onclick="saveCustomData()">Lưu lại</button>
        </div>
    </div>
</div>

<script>
    // Dữ liệu ban đầu bạn cung cấp
    let dataStore = {
        "LLCC": "B",
        "LCLL": "P",
        "LLLL": "H",
        "CLCC": "B",
        "LCCL": "B",
        "CLLL": "P"
    };

    // Hàm đổi giá trị C <=> L khi click vào ô nhập
    function toggleValue(inputElement) {
        if (inputElement.value === "C") {
            inputElement.value = "L";
        } else {
            inputElement.value = "C";
        }
        checkResult();
    }

    // Hàm kiểm tra và hiển thị kết quả
    function checkResult() {
        // Lấy giá trị của 4 ô ghép lại thành chuỗi (ví dụ: LLLL)
        let key = document.getElementById("box1").value +
                  document.getElementById("box2").value +
                  document.getElementById("box3").value +
                  document.getElementById("box4").value;

        let resultBox = document.getElementById("result-box");
        let customSection = document.getElementById("custom-input-section");

        // Tra cứu trong dữ liệu
        if (dataStore[key]) {
            resultBox.innerText = dataStore[key];
            resultBox.style.backgroundColor = "#007bff"; // Màu xanh dương khi có kết quả
            customSection.style.display = "none"; // Ẩn ô nhập thêm dữ liệu
        } else {
            resultBox.innerText = "❌";
            resultBox.style.backgroundColor = "#6c757d"; // Màu xám khi chưa có dữ liệu
            customSection.style.display = "block"; // Hiện ô nhập thêm dữ liệu
            document.getElementById("custom-result-input").value = ""; // Xóa chữ ô nhập cũ
            document.getElementById("custom-result-input").focus();
        }
    }

    // Hàm lưu dữ liệu mới do bạn nhập vào
    function saveCustomData() {
        let key = document.getElementById("box1").value +
                  document.getElementById("box2").value +
                  document.getElementById("box3").value +
                  document.getElementById("box4").value;
                  
        let customInput = document.getElementById("custom-result-input").value.toUpperCase().trim();

        if (customInput === "P" || customInput === "B" || customInput === "H") {
            // Thêm vào bộ nhớ tạm của trang
            dataStore[key] = customInput;
            alert(`Đã thêm thành công: ${key} = ${customInput}`);
            checkResult(); // Cập nhật lại kết quả hiển thị lên ô to
        } else {
            alert("Vui lòng chỉ nhập một trong các ký tự: P, B hoặc H");
        }
    }

    // Chạy kiểm tra lần đầu tiên khi vừa tải trang
    window.onload = checkResult;
</script>

</body>
</html>
