<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quy Đổi Bài Baccarat Sang Điểm Xúc Xắc</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            margin-bottom: 10px;
            text-align: center;
            color: #f39c12;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-size: 24px;
        }
        .sub-title {
            color: #ccc;
            margin-bottom: 25px;
            font-size: 14px;
            text-align: center;
        }
        .container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            gap: 20px;
            margin-bottom: 20px;
        }
        .side {
            flex: 1;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            text-align: center;
            transition: transform 0.2s;
        }
        .side:hover {
            transform: translateY(-5px);
        }
        .left-side {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border: 3px solid #3498db;
        }
        .right-side {
            background: linear-gradient(135deg, #b22222, #8b0000);
            border: 3px solid #e74c3c;
        }
        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .card-inputs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .card-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        label {
            font-size: 12px;
            opacity: 0.8;
        }
        select {
            width: 85px;
            height: 50px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            border-radius: 8px;
            border: none;
            background-color: white;
            color: #333;
            cursor: pointer;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        select:focus {
            outline: 3px solid #f39c12;
        }
        .result-box {
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }
        .converted-details {
            font-size: 14px;
            color: #e0e0e0;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .total-score {
            font-size: 64px;
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        .score-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
            margin-top: 5px;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <h1>🃏 QUY ĐỔI BACCARAT ➔ XÚC XẮC 🎲</h1>
    <div class="sub-title">Nhập các lá bài của mỗi bên để tự động dịch sang tổng điểm xúc xắc</div>

    <div class="container">
        <!-- BÊN TRÁI MÀU XANH -->
        <div class="side left-side">
            <h2>Player (Xanh)</h2>
            <div class="card-inputs">
                <div class="card-box">
                    <label>Lá 1</label>
                    <select class="left-card" onchange="calculateResults()">
                        <option value="A">A</option><option value="2">2</option><option value="3">3</option>
                        <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                        <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                        <option value="10">10</option><option value="J">J</option><option value="Q">Q</option><option value="K">K</option>
                    </select>
                </div>
                <div class="card-box">
                    <label>Lá 2</label>
                    <select class="left-card" onchange="calculateResults()">
                        <option value="A">A</option><option value="2">2</option><option value="3">3</option>
                        <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                        <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                        <option value="10">10</option><option value="J">J</option><option value="Q">Q</option><option value="K">K</option>
                    </select>
                </div>
                <div class="card-box">
                    <label>Lá 3</label>
                    <select class="left-card" onchange="calculateResults()">
                        <option value="NONE">Không rút</option>
                        <option value="A">A</option><option value="2">2</option><option value="3">3</option>
                        <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                        <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                        <option value="10">10</option><option value="J">J</option><option value="Q">Q</option><option value="K">K</option>
                    </select>
                </div>
            </div>
            <div class="result-box">
                <div class="converted-details" id="left-details">Đang tính...</div>
                <div class="score-label">Tổng Điểm Xúc Xắc</div>
                <div class="total-score" id="left-total">0</div>
            </div>
        </div>

        <!-- BÊN PHẢI MÀU ĐỎ -->
        <div class="side right-side">
            <h2>Banker (Đỏ)</h2>
            <div class="card-inputs">
                <div class="card-box">
                    <label>Lá 1</label>
                    <select class="right-card" onchange="calculateResults()">
                        <option value="A">A</option><option value="2">2</option><option value="3">3</option>
                        <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                        <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                        <option value="10">10</option><option value="J">J</option><option value="Q">Q</option><option value="K">K</option>
                    </select>
                </div>
                <div class="card-box">
                    <label>Lá 2</label>
                    <select class="right-card" onchange="calculateResults()">
                        <option value="A">A</option><option value="2">2</option><option value="3">3</option>
                        <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                        <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                        <option value="10">10</option><option value="J">J</option><option value="Q">Q</option><option value="K">K</option>
                    </select>
                </div>
                <div class="card-box">
                    <label>Lá 3</label>
                    <select class="right-card" onchange="calculateResults()">
                        <option value="NONE">Không rút</option>
                        <option value="A">A</option><option value="2">2</option><option value="3">3</option>
                        <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                        <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                        <option value="10">10</option><option value="J">J</option><option value="Q">Q</option><option value="K">K</option>
                    </select>
                </div>
            </div>
            <div class="result-box">
                <div class="converted-details" id="right-details">Đang tính...</div>
                <div class="score-label">Tổng Điểm Xúc Xắc</div>
                <div class="total-score" id="right-total">0</div>
            </div>
        </div>
    </div>

    <script>
        // Hàm chuyển đổi từ ký hiệu lá bài sang điểm xúc xắc theo đúng ảnh cung cấp
        function convertCardToDiceValue(card) {
            if (card === "NONE") return 0; // Trường hợp bên nào chỉ chơi 2 lá không rút lá thứ 3
            
            if (card === "10" || card === "J" || card === "Q" || card === "K" || card === "A") {
                return 1;
            } else if (card === "2" || card === "3") {
                return 2;
            } else if (card === "4" || card === "5") {
                return 3;
            } else if (card === "6" || card === "7") {
                return 4;
            } else if (card === "8") {
                return 5;
            } else if (card === "9") {
                return 6;
            }
            return 0;
        }

        function calculateResults() {
            // Xử lý bên trái (Player)
            const leftSelects = document.querySelectorAll('.left-card');
            let leftDiceValues = [];
            let leftSum = 0;
            
            leftSelects.forEach(select => {
                let diceVal = convertCardToDiceValue(select.value);
