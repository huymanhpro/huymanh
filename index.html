<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baccarat Matrix Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .select-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .select-box {
            width: 45%;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            background-color: #fff;
            cursor: pointer;
        }
        select:focus {
            border-color: #4abc96;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #4abc96;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #3a9d7c;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            display: none;
        }
        .b { background-color: #ffebee; color: #c62828; border: 2px solid #ef9a9a; }
        .p { background-color: #e3f2fd; color: #1565c0; border: 2px solid #90caf9; }
        .h { background-color: #e8f5e9; color: #2e7d32; border: 2px solid #a5d6a7; }
    </style>
</head>
<body>

<div class="container">
    <h2>Baccarat Predictor</h2>
    
    <div class="select-group">
        <div class="select-box">
            <label for="card1">Lá bài 1</label>
            <select id="card1">
                <option value="1">1 (A)</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="j">J</option>
                <option value="q">Q</option>
                <option value="k">K</option>
            </select>
        </div>
        
        <div class="select-box">
            <label for="card2">Lá bài 2</label>
            <select id="card2">
                <option value="1">1 (A)</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="j">J</option>
                <option value="q">Q</option>
                <option value="k">K</option>
            </select>
        </div>
    </div>

    <button onclick="predictNextHand()">DỰ ĐOÁN TAY SAU</button>

    <div id="result" class="result-box"></div>
</div>

<script>
// Định nghĩa cơ sở dữ liệu gốc của bạn (Thứ tự chuẩn xác 1q khác q1)
const exactRules = {
    "7q": "p", "1q": "b", "32": "b", "q4": "b", "4j": "p", "8j": "p", 
    "81": "b", "29": "b", "87": "b", "62": "p", "q9": "p", "71": "b", 
    "67": "p", "47": "b", "79": "p", "q2": "p", "910": "h", "51": "p", 
    "98": "b", "10j": "b", "2q": "p", "92": "b", "36": "p", "j8": "p"
};

// Chuyển đổi ký tự bài sang điểm số Baccarat chuyên sâu
function getBaccaratScore(card) {
    if (card === "10" || card === "j" || card === "q" || card === "k") {
        return 0;
    }
    return parseInt(card);
}

function predictNextHand() {
    const c1 = document.getElementById("card1").value;
    const c2 = document.getElementById("card2").value;
    
    // Tạo khóa tìm kiếm chuỗi (VD: "7q")
    const key = c1 + c2;
    const resultDiv = document.getElementById("result");
    
    // Kiểm tra tính hợp lệ (Không được chọn 2 lá trùng nhau hoàn toàn trong cùng 1 bộ bài baccarat gốc)
    if (c1 === c2) {
        resultDiv.style.display = "block";
        resultDiv.className = "result-box b";
        resultDiv.innerHTML = "Lỗi: Vui lòng chọn 2 lá khác nhau!";
        return;
    }

    let finalPrediction = "";
    let isExact = false;

    // 1. Kiểm tra xem cặp này có nằm trong dữ liệu gốc bạn cung cấp không
    if (exactRules[key]) {
        finalPrediction = exactRules[key];
        isExact = true;
    } else {
        // 2. Nếu chưa có trong dữ liệu gốc, tính toán dựa trên thuật toán tổng điểm đơn vị Baccarat
        const score1 = getBaccaratScore(c1);
        const score2 = getBaccaratScore(c2);
        const totalPoints = (score1 + score2) % 10;

        // Ma trận suy luận dựa trên phân bổ tổng điểm từ dữ liệu thực tế
        if (totalPoints === 0 || totalPoints === 1 || totalPoints === 5) {
            finalPrediction = "b";
        } else if (totalPoints === 2 || totalPoints === 3 || totalPoints === 6 || totalPoints === 8) {
            finalPrediction = "p";
        } else if (totalPoints === 9) {
            finalPrediction = "h";
        } else {
            // Điểm 4 và 7 có sự phân tách động, mặc định tối ưu theo xác suất dữ liệu nền
            finalPrediction = (totalPoints === 4) ? "b" : "p";
        }
    }

    // Hiển thị kết quả lên giao diện trực quan
    resultDiv.style.display = "block";
    resultDiv.className = "result-box " + finalPrediction;
    
    let textResult = finalPrediction.toUpperCase();
    if (textResult === "B") textResult = "🔴 BANKER (Nhà Cái)";
    if (textResult === "P") textResult = "🔵 PLAYER (Nhà Con)";
    if (textResult === "H") textResult = "🟢 TIE (Hòa)";

    resultDiv.innerHTML = textResult + (isExact ? " <br><small style='font-size:12px; font-weight:normal;'>(Khớp dữ liệu gốc của bạn)</small>" : " <br><small style='font-size:12px; font-weight:normal;'>(Suy luận theo ma trận điểm)</small>");
}
</script>

</body>
</html>
