<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Tính Điểm Xanh Đỏ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            display: flex;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            gap: 25px;
            max-width: 950px;
            width: 100%;
        }
        .left-panel {
            flex: 2;
            padding-right: 10px;
        }
        .right-panel {
            flex: 1;
            padding-left: 20px;
            border-left: 2px solid #e4e6eb;
            display: flex;
            flex-direction: column;
        }
        h3 {
            margin-top: 0;
            color: #1c1e21;
            font-size: 18px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }
        .grid-inputs {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .box {
            border: 2px solid #ccd0d5;
            border-radius: 8px;
            padding: 12px;
            width: 150px;
            text-align: center;
            box-sizing: border-box;
            background-color: #fff;
        }
        .box-blue { border-color: #007bff; background-color: #f0f7ff; }
        .box-red { border-color: #dc3545; background-color: #fff5f5; }
        .box-gray { border-color: #6c757d; background-color: #f8f9fa; }
        
        label {
            display: block;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 12px;
            color: #4b4f56;
        }
        select {
            width: 100%;
            padding: 6px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccd0d5;
            cursor: pointer;
        }
        .three-inputs {
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        .three-inputs select {
            width: 42px;
            padding: 4px;
            font-size: 15px;
            text-align: center;
        }
        .display-slots {
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        .slot {
            width: 38px;
            height: 30px;
            line-height: 30px;
            background-color: #e4e6eb;
            border: 1px solid #ccd0d5;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
        .btn-ok {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(40, 167, 69, 0.2);
        }
        .btn-ok:hover { background-color: #218838; }
        
        .history-list {
            border: 1px solid #ccd0d5;
            border-radius: 6px;
            height: 250px;
            overflow-y: auto;
            padding: 10px;
            background: #f9fafb;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            flex-grow: 1;
            margin-bottom: 12px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px;
            border-bottom: 1px dashed #e4e6eb;
            color: #333;
        }
        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-delete:hover { background-color: #bd2130; }
        
        .btn-copy {
            background-color: #17a2b8;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .btn-copy:hover { background-color: #138496; }
    </style>
</head>
<body>

<div class="container">
    <!-- BÊN TRÁI: KHU VỰC NHẬP LIỆU -->
    <div class="left-panel">
        <h3>Nhập Dữ Liệu</h3>
        <div class="grid-inputs">
            <!-- Ô 1 -->
            <div class="box box-blue">
                <label>Ô 1 (Xanh)</label>
                <select id="box1">
                    <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
                </select>
            </div>
            
            <!-- Ô 2 -->
            <div class="box box-red">
                <label>Ô 2 (Đỏ)</label>
                <select id="box2">
                    <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
                </select>
            </div>
            
            <!-- Ô 3 -->
            <div class="box box-blue">
                <label>Ô 3 (Chọn 3 số)</label>
                <div class="three-inputs">
                    <select id="b3_1" onchange="syncBox4()">
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select>
                    <select id="b3_2" onchange="syncBox4()">
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select>
                    <select id="b3_3" onchange="syncBox4()">
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select>
                </div>
            </div>
            
            <!-- Ô 4 -->
            <div class="box box-red">
                <label>Ô 4 (Tự động đảo)</label>
                <div class="display-slots">
                    <div class="slot" id="b4_1">2</div>
                    <div class="slot" id="b4_2">2</div>
                    <div class="slot" id="b4_3">2</div>
                </div>
            </div>
            
            <!-- Ô 5 -->
            <div class="box box-gray">
                <label>Ô 5 (Lựa chọn)</label>
                <select id="box5">
                    <option value="P">P</option>
                    <option value="B">B</option>
                    <option value="H">H</option>
                </select>
            </div>
        </div>
        
        <button class="btn-ok" onclick="handleCalculate()">OK</button>
    </div>
    
    <!-- BÊN PHẢI: KẾT QUẢ TÍCH LŨY -->
    <div class="right-panel">
        <h3>Danh Sách Kết Quả</h3>
        <div class="history-list" id="historyList"></div>
        <button class="btn-copy" onclick="copyHistory()">Sao chép danh sách</button>
    </div>
</div>

<script>
    // Tự động đồng bộ đảo giá trị từ Ô 3 sang Ô 4 ngay khi người dùng chọn
    function syncBox4() {
        let v1 = document.getElementById('b3_1').value;
        let v2 = document.getElementById('b3_2').value;
        let v3 = document.getElementById('b3_3').value;
        
        document.getElementById('b4_1').innerText = (v1 === '1') ? '2' : '1';
        document.getElementById('b4_2').innerText = (v2 === '1') ? '2' : '1';
        document.getElementById('b4_3').innerText = (v3 === '1') ? '2' : '1';
    }

    // Chạy đồng bộ lần đầu tiên khi vừa tải trang
    syncBox4();

    // Thực hiện tính toán khi nhấn OK
    function handleCalculate() {
        let num1 = parseInt(document.getElementById('box1').value);
        let num2 = parseInt(document.getElementById('box2').value);
        
        // Đọc giá trị từ Ô 3 công thức số trực tiếp
        let b3_1 = parseInt(document.getElementById('b3_1').value);
        let b3_2 = parseInt(document.getElementById('b3_2').value);
        let b3_3 = parseInt(document.getElementById('b3_3').value);
        
        // Đọc giá trị tự động từ Ô 4
        let b4_1 = parseInt(document.getElementById('b4_1').innerText);
        let b4_2 = parseInt(document.getElementById('b4_2').innerText);
        let b4_3 = parseInt(document.getElementById('b4_3').innerText);
        
        // Tính tổng bên màu xanh (Ô 1 + Ô 3) và bên màu đỏ (Ô 2 + Ô 4)
        let sumBlue = num1 + b3_1 + b3_2 + b3_3;
        let sumRed = num2 + b4_1 + b4_2 + b4_3;
        
        // Lấy số hàng đơn vị nếu tổng > 9
        let a = sumBlue % 10;
        let b = sumRed % 10;
        
        let choice5 = document.getElementById('box5').value;
        let resultText = a + "-" + b + "=" + choice5;
        
        // Đưa vào danh sách kết quả bên phải
        const historyList = document.getElementById('historyList');
        const newItem = document.createElement('div');
        newItem.className = 'history-item';
        
        const textSpan = document.createElement('span');
        textSpan.className = 'item-text';
        textSpan.innerText = resultText;
